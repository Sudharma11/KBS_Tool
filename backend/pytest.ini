[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    --strict-markers
    -v
    --tb=short
markers =
    slow: marks tests as slow
    integration: integration tests
    unit: unit tests
    api: API tests
filterwarnings =
    ignore::DeprecationWarning
    ignore::UserWarning
